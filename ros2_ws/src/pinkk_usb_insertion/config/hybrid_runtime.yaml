# 노트북에서 실행하는 카메라 노드 설정.
# USB 재연결 후 /dev/video 번호가 바뀔 수 있으므로 RQT에서 원본 영상을
# 확인한 뒤 수정한다. 가능하면 /dev/v4l/by-id/... 영구 경로를 사용한다.
pinkk_usb_camera_node:
  ros__parameters:
    # Sonix 로봇팔 카메라의 영구 경로. USB 재연결로 video 번호가 바뀌어도
    # 실제 영상 인터페이스(index0)를 계속 선택한다.
    camera_device: /dev/v4l/by-id/usb-Sonix_Technology_Co.__Ltd._USB_2.0_Camera-video-index0
    # 카메라 발행 주파수. 장치가 지원하지 않으면 실제 주파수는 더 낮을 수 있다.
    publish_rate_hz: 30.0

# YOLO Pose 추론 설정. 이 노드는 /camera/image_raw를 받아 포트 keypoint 4개와
# /robot_arm/perception/usb_port/debug_image를 발행한다.
pinkk_yolo_keypoint_node:
  ros__parameters:
    # 저장소 루트(Pinkk-robot-arm) 기준으로 한 단계 위 Desktop의 모델 파일.
    # scripts/run_laptop_frozen_target_test.sh가 실행 위치를 저장소 루트로 고정한다.
    model_path: ../usb_02.pt
    image_size: 640
    # 낮추면 검출은 늘지만 오검출도 증가한다.
    confidence_threshold: 0.25
    # 네 keypoint 중 사용할 수 있는 점의 최소 visibility.
    visibility_threshold: 0.01
    # NVIDIA GPU는 cuda:0, CPU 시험은 cpu로 설정한다.
    device: cuda:0
    # true이면 RQT에서 볼 수 있는 keypoint 표시 영상을 발행한다.
    debug_image_enabled: true

# SolvePnP 포트 자세 추정 노드. 현재는 노드 기본값을 사용한다.
pinkk_port_pose_node:
  ros__parameters: {}

# 카메라 관측과 flange TF로 PBVS 목표 자세를 계산하는 노드.
# 이 노드는 목표만 발행하며 실제 로봇 명령은 보내지 않는다.
pinkk_pbvs_alignment_node:
  ros__parameters:
    # 서로 다른 PC의 시계 오차를 피하기 위해 정지 상태의 최신 flange TF 사용.
    use_latest_flange_tf: true
    # 포트 장축 방향 계산을 활성화한다. 실제 Yaw 실행은 아래 실행기가 담당한다.
    enable_yaw_pbvs: true
    # 포트의 g_base 절대 X/Y와 pre-approach Z를 목표로 사용하는 현재 시험 모드.
    absolute_port_xy_yaw_mode: true
    # [m] 포트 base Z보다 높은 coarse pre-approach 높이.
    # Yaw/Roll/Pitch 정렬 중 실측 약 26mm의 Z 결합 하강이 발생해, TCP
    # 130mm 시험에서는 정렬 완료 후 하강 여유를 확보하도록 180mm를 쓴다.
    # 0이면 초기 관측 flange Z를 목표로 사용하므로 해가 없을 수 있다.
    absolute_pre_approach_height_m: 0.18
    # [m] 비절대 TARGET_ONLY 모드의 PBVS 1회 최대 XY step.
    # absolute_port_xy_yaw_mode=true에서는 실행기의 maximum_xy_step_m이
    # 실제 절대 XY 목표 제한으로 사용된다.
    maximum_xy_step_m: 0.003

# 제조사 API bridge로 명시적인 단발 이동을 보내는 노트북 실행기.
# 지원 명령: coarse_xy, coarse_xy_then_yaw, refine_xy, refine_yaw,
# recover_z_once, waypoint_pbvs_align
pinkk_pbvs_step_executor_node:
  ros__parameters:
    # false이면 계산/관측만 하고 실제 로봇 이동을 차단한다.
    enable_execution: true
    base_frame: g_base
    flange_frame: joint6_flange
    # [s] 이 시간보다 오래된 PBVS/Joint/Yaw 입력은 실행하지 않는다.
    maximum_input_age_seconds: 1.0
    # [m] 기기 백래시·정지오차보다 작은 XY 명령은 보내지 않는다.
    # 현재 하드웨어 시험값 3mm. 너무 작으면 미세명령이 실제로 반영되지 않는다.
    minimum_xy_step_m: 0.003
    # [m] 한 번에 허용하는 절대 XY 이동의 안전 상한. 현재 100mm.
    maximum_xy_step_m: 0.10
    # true이면 coarse 첫 이동에서 PBVS target의 X/Y만 사용하고 목표 Z는
    # 저장된 초기 관측 flange Z로 덮어쓴다. 카메라 높이를 유지해 이동 후
    # 포트 재관측 가능성을 높이기 위한 현재 시험 설정이다.
    coarse_use_observation_z: true
    # PyMyCobot send_coords 속도(1~100). 처음에는 10 이하 권장.
    cartesian_speed: 10
    # send_coords mode: 0=비선형/각도 우선, 1=선형 좌표 이동.
    # 현재 XY 직선 이동 비교 시험을 위해 mode 1을 사용한다.
    cartesian_mode: 0
    # [s] 노트북 실행기가 bridge action 결과를 기다리는 최대 시간.
    cartesian_timeout_seconds: 100.0
    # [s] 실제 이동 직전 사용자가 중단할 수 있는 경고 대기 시간.
    warning_delay_seconds: 1.5
    # [s] coarse XY 완료 후 이동 진동이 가라앉기를 기다리는 시간.
    post_coarse_yaw_delay_seconds: 0.8
    # [s] coarse XY 뒤 새로운 PBVS target과 keypoint를 기다리는 최대 시간.
    reobservation_timeout_seconds: 5.0
    # true이면 coarse_xy_then_yaw의 이동 후 포트가 사라졌을 때 초기 관절
    # 자세로 돌아가지 않고 현재 X/Y를 유지한 채 Z-only 상승 복구를 시도한다.
    # 새 waypoint_pbvs_align 흐름은 이 값을 사용하지 않고 대신 아래
    # enable_last_visible_pose_recovery로 복귀한다. 현재 XY에서 Z만
    # 올리는 목표는 IK가 없는 경우가 많아 새 흐름 기본값은 false로 둔다.
    # 현재 coarse는 초기 관측 Z를 유지하므로 자동 Z 상승 복구는 끈다.
    # 이동 후 포트가 보이지 않으면 추가 이동 없이 명령을 종료한다.
    enable_automatic_z_recovery: false
    # [m] 한 번의 Z-only 상승량. 초기 관측 Z를 넘지 않는다.
    # enable_automatic_z_recovery=true일 때만 사용되는 옛 복구 방식이다.
    z_recovery_step_m: 0.015
    # Z-only 복구에만 사용하는 send_coords mode.
    # 1은 현재 X/Y와 목표 자세를 유지한 직선 Z 이동을 요청한다.
    # 일반 coarse/refine XY 이동은 위 cartesian_mode 값을 사용한다.
    # 직선 경로의 중간 해가 없으면 mode 0보다 거절될 가능성이 있다.
    z_recovery_cartesian_mode: 1
    # 포트가 계속 안 보일 때 허용할 자동 Z-only 이동 횟수.
    z_recovery_max_attempts: 2
    # [s] 각 Z 이동 후 진동이 가라앉기를 기다린 뒤 재관측하는 시간.
    z_recovery_settle_seconds: 0.8
    # true이면 Z-only 목표 Roll/Pitch는 초기 관측값, Yaw는 현재값을 사용한다.
    # 정지 후 observation_roll_pitch_tolerance_deg로 실제 자세를 확인한다.
    # coarse/refine XY에는 아래 use_observation_roll_pitch_target 설정이 계속 적용된다.
    z_recovery_use_observation_roll_pitch_target: false
    # true이면 Z-only 이동 중 시작 Roll/Pitch에서 bridge 허용값을 넘는 순간
    # action을 중단한다. 목표 자세는 위 초기 관측 Roll/Pitch를 사용한다.
    z_recovery_lock_roll_pitch: false
    # [m] 이동 후 XY 잔여오차가 이 값 이하여야 Joint6 Yaw를 허용한다.
    # waypoint_pbvs_align도 이 값 이하가 되면 XY step을 멈추고 Yaw로 넘어간다.
    yaw_start_xy_tolerance_m: 0.005
    # coarse_xy_then_yaw가 Z 복구 후 새 관측으로 자동 실행할 refine_xy 상한.
    # 이 횟수 후에도 XY 오차가 위 허용값보다 크면 Yaw 없이 정지한다.
    automatic_refine_xy_max_cycles: 2
    # --- waypoint_pbvs_align 전용 파라미터 ---
    # [m] "마지막 가시 자세 복귀 + 제한된 waypoint stop-and-go PBVS" 명령.
    # PBVS 절대 목표까지 한 번에 이동하지 않고, 목표 방향으로 아래 XY/Z
    # 최대 step만큼만 이동한 뒤 정지·재관측을 반복한다.
    # [m] 한 번의 waypoint 이동에서 허용하는 최대 XY 이동량.
    waypoint_maximum_xy_step_m: 0.015
    # [m] 한 번의 waypoint 이동에서 허용하는 최대 Z 이동량 (XY와 독립적).
    waypoint_maximum_z_step_m: 0.010
    # 한 번의 waypoint_pbvs_align 명령 안에서 허용하는 최대 XY 이동 반복 횟수.
    # 총 이동량 상한은 이 값과 waypoint_maximum_xy_step_m의 곱으로 계산된다.
    waypoint_max_cycles: 6
    # [s] 각 waypoint 이동 정지 후 진동이 가라앉기를 기다리는 시간.
    waypoint_settle_seconds: 0.8
    # true이면 재관측 실패 시 임의로 Z를 올리지 않고 이번 명령이 방금
    # 실제로 지나온 last_visible_flange_pose(마지막으로 포트가 보였던
    # 도달 가능한 자세)로 Cartesian 복귀한다. 복귀 후에는 자동 연속
    # 이동을 중단하고 재관측 결과만 보고한다.
    enable_last_visible_pose_recovery: true
    # true이면 coarse/refine 목표 Roll/Pitch에 초기 관측 자세를 사용하고,
    # Yaw는 이동 직전 현재값을 유지한다.
    use_observation_roll_pitch_target: true
    # true이면 coarse/refine XY 이동 중 시작 Roll/Pitch에서 bridge 허용값을
    # 넘는 순간 action을 중단한다. mode 1 직선 이동 시험과 함께 사용한다.
    lock_roll_pitch_during_xy: true
    # [deg] 이동이 끝난 뒤 초기 관측 Roll/Pitch와 허용할 차이.
    # 이동 경로를 강제 고정하지 않고 정지 후에만 이 값으로 검사한다.
    observation_roll_pitch_tolerance_deg: 5.0
    # [deg] 충전기와 포트가 정렬됐을 때의 목표 영상 장축각.
    # 현재 0도는 임시값이며 충전기 장착 후 다시 측정해야 한다.
    keypoint_desired_axis_deg: 0.0
    # [deg] 기기 데드밴드보다 작은 Joint6 명령은 보내지 않는다.
    minimum_yaw_step_deg: 3.0
    # [deg] 한 번의 Joint6 보정 명령 상한. 먼저 5도로 시험한다.
    keypoint_maximum_step_deg: 5.0
    # [deg] 영상 Yaw가 이 범위 안이면 더 움직이지 않는다.
    # 1도는 기기 오차보다 작아 현재 coarse 시험에서는 3도를 사용한다.
    keypoint_tolerance_deg: 3.0
    # 영상각 오차를 명령 방향으로 바꾸는 부호. 반대로 돌면 +1로 변경한다.
    keypoint_command_sign: -1.0
    # 영상각 1도당 필요한 Joint6 명령각의 실측 비율.
    keypoint_joint_gain: 1.32
    # 로봇 Joint6 좌표계 방향 보정. 반대로 돌면 +1로 변경한다.
    joint6_direction: -1.0
    # [deg] Joint6 절대 목표의 소프트 안전 제한.
    joint6_limit_deg: 175.0
    # [s] Joint6 단발 trajectory 목표 시간.
    joint6_move_seconds: 15.0

# 초기 관측 한 번의 PBVS 목표를 고정하고 이후에는 flange TF 오차만
# 반복 보정하는 별도 시험 실행기. frozen_target_alignment.launch.py에서 사용한다.
pinkk_frozen_target_executor_node:
  ros__parameters:
    # false이면 모든 계산과 상태 발행은 하지만 실제 로봇 action을 보내지 않는다.
    enable_execution: true
    # true이면 포트가 영상 중앙에서 아래 조건을 연속 만족할 때 수동 topic
    # 명령 없이 최종 Z 포함 통합 제어를 프로세스당 한 번 자동 시작한다.
    # 한 번 실행한 뒤에는 노드를 재시작하기 전까지 다시 자동 시작하지 않는다.
    auto_start_enabled: true
    # [s] 차량이 정지했다고 판단하기 위한 연속 관찰 시간.
    auto_start_stable_duration_seconds: 5.0
    # 위 시간창에 필요한 최소 유효 SolvePnP 관측 수.
    auto_start_minimum_samples: 30
    # [px] 640x480 영상에서 제어 시작 기준이 되는 화면 중심.
    auto_start_image_center_u_px: 320.0
    auto_start_image_center_v_px: 240.0
    # [px] 포트 네 keypoint 중심과 화면 중심 사이 허용 거리.
    auto_start_center_tolerance_px: 80.0
    # [px] 관찰 시간 동안 포트 중심의 최대 흔들림.
    auto_start_maximum_center_spread_px: 5.0
    # [m] 관찰 시간 동안 SolvePnP depth의 중앙값 대비 최대 흔들림.
    auto_start_maximum_depth_spread_m: 0.005
    # [deg] 관찰 시간 동안 keypoint 장축각의 최대 흔들림.
    auto_start_maximum_yaw_spread_deg: 2.0
    # [s] 이보다 긴 검출 공백이 있으면 연속 관찰로 인정하지 않는다.
    auto_start_maximum_sample_gap_seconds: 0.5
    # 모든 포트/flange 목표를 표현하는 로봇 base 좌표계.
    base_frame: g_base
    # 실제 Cartesian 제어와 현재 자세 조회에 사용하는 말단 flange TF.
    flange_frame: joint6_flange
    # [s] PBVS target, port pose, keypoint가 이 시간보다 오래되면 실행 거부.
    maximum_input_age_seconds: 1.0
    # [s] 로봇 PC get_coords 기반 실제 Cartesian pose 최대 허용 age.
    # 브리지가 2Hz로 발행하므로 2초 이내 값만 증분 명령 기준으로 사용한다.
    hardware_cartesian_pose_maximum_age_seconds: 2.0
    # 초기 목표는 마지막 한 장이 아니라 최근 유효 관측 5장을 집계해 고정한다.
    initial_observation_sample_count: 5
    # median은 한두 프레임의 YOLO/SolvePnP 이상값에 덜 끌린다.
    # 비교 시험이 필요하면 mean으로 바꿀 수 있다.
    initial_observation_aggregation_method: median
    # [s] 평균에 포함할 최근 관측 시간창. 5장이 이 안에 없으면 실행을 거부한다.
    initial_observation_sample_window_seconds: 1.0
    # [m] 평균 XY에서 가장 멀리 벗어난 표본의 허용 거리.
    initial_observation_maximum_xy_spread_m: 0.008
    # [m] PBVS target Z와 port Z 각각의 평균 대비 최대 허용 편차.
    initial_observation_maximum_z_spread_m: 0.015
    # [deg] 원형 평균 Yaw에서 각 표본의 최대 허용 편차.
    initial_observation_maximum_yaw_spread_deg: 8.0
    # [m] 하드웨어 데드밴드보다 작은 XY 명령은 보내지 않는다: 3mm.
    minimum_xy_step_m: 0.003
    # [m] 초기 관측에서 허용하는 첫 coarse XY 이동 거리 상한: 100mm.
    maximum_coarse_xy_step_m: 0.100
    # coarse가 timeout으로 끝나도 실제 목표 XY에서 이 거리 이내까지 왔다면
    # 현재 도달 자세를 수용하고 아래 XY refine을 계속한다.
    maximum_partial_coarse_xy_residual_m: 0.030
    # 저장 목표와 현재 flange TF의 XY 오차가 이 값 이하면 수렴으로 본다.
    # 서로 다른 포트 각도에서도 R/P 복구 뒤 XY가 4.5~5mm에서 반복 정지해,
    # 추가 refine으로 Z 여유만 소모하지 않도록 하강 단계와 같은 5mm를 쓴다.
    robot_xy_tracking_tolerance_m: 0.005
    # 카메라 재관측 없이 flange TF로 반복할 최대 XY 보정 횟수.
    robot_xy_refine_max_cycles: 3
    # 한 번의 로봇좌표 보정에서 허용하는 최대 XY 이동량. frozen X/Y는
    # TF 절대 목표를 사용하고 endpoint Z/RPY는 제조사 actual pose를 쓴다.
    robot_xy_refine_maximum_step_m: 0.020
    # 한 사이클에서 이 값 이상 오차가 줄지 않으면 추가 이동을 중단한다.
    robot_xy_minimum_improvement_m: 0.001
    # false이면 오차가 줄지 않거나 잠시 증가해도 즉시 중단하지 않고,
    # robot_xy_refine_max_cycles 한도까지 다음 XY 보정을 계속한다.
    stop_on_insufficient_xy_improvement: false
    # PyMyCobot send_coords의 coarse/XY/Roll-Pitch 보정 기본 속도(1~100).
    cartesian_speed: 10
    # 1=제조사 Cartesian 직선 이동. 초기 비교 조합으로 복귀한다.
    # 순수 Z 단계는 아래 joint backend라 이 값의 영향을 받지 않는다.
    cartesian_mode: 1
    # [s] 노트북 실행기가 로봇 PC Cartesian action 결과를 기다리는 상한.
    cartesian_timeout_seconds: 100.0
    # [s] 통합 XY/Yaw/Z 시험에서 각 실제 이동 전 중단 여유 시간.
    # 반복 명령마다 적용되는 소프트웨어 대기만 0.5초로 줄인다.
    # 브리지의 실제 정지 확인과 action timeout은 이 값과 별개로 유지된다.
    warning_delay_seconds: 0.5
    # [s] 각 이동 완료 후 진동이 가라앉은 뒤 TF를 다시 읽기까지의 시간.
    settle_seconds: 0.5
    # 통합 Z 단계에서 사용할 제조사 send_coords 속도와 mode.
    vertical_z_cartesian_speed: 5
    # 1=제조사 직선 Cartesian 이동.
    vertical_z_cartesian_mode: 1
    # 통합 실행의 guard 하강, 최종 10mm, R/P 뒤 5mm에 사용할 Z 제어 방식.
    # joint는 Jacobian으로 관절 증분을 계산해 send_angles로 실행한다.
    vertical_z_control_backend: joint
    # true이면 초기 관측 Z 대신 PBVS target Z를 사용한다. 위 alignment의
    # 위 absolute_pre_approach_height_m만큼 포트 Z보다 높은 목표를 사용한다.
    use_pbvs_target_z: true
    # [m] execute_once의 첫 coarse/pre-approach 목표 Z 유효범위.
    # 이 값은 삽입 하강의 바닥값이 아니다. PBVS가 계산한 초기 flange 목표가
    # 150mm보다 낮으면 잘못된 SolvePnP 결과로 보고 coarse 자체를 거부한다.
    minimum_target_z_m: 0.150
    # [m] 위 coarse/pre-approach 목표 Z의 최대 허용값: 350mm.
    maximum_target_z_m: 0.350
    # false이면 Z 목표는 전송하지만 이동 경로에서 시작 Z 고정을 요구하지 않는다.
    lock_z: false
    # false이면 coarse 이동 경로의 Roll/Pitch 이탈을 즉시 차단하지 않는다.
    # 이동 정지 후 아래 복구 로직이 초기 관측 Roll/Pitch를 다시 확인·보정한다.
    lock_roll_pitch: false
    # true이면 초기 실측 R/P 대신 모든 정렬·하강 보정·최종 오차 기준을
    # 아래 절대 Roll/Pitch로 고정한다. Yaw는 기존 초기 관측/보정값을 유지한다.
    use_fixed_roll_pitch_target: true
    fixed_roll_target_deg: -177.5
    fixed_pitch_target_deg: 0.0
    # Pitch 보정량에만 곱하는 개별 gain. Roll gain은 기존값 그대로이다.
    # 1.2는 계산된 Pitch 오차의 120%를 명령해 반복적인 미달을 보상한다.
    pitch_correction_gain: 1.70
    # [deg] 초기 관측 Roll/Pitch와 정지 후 허용하는 최대 차이.
    roll_pitch_tolerance_deg: 5.0
    # true이면 정지 후 Roll/Pitch가 위 허용오차를 넘을 때 즉시 실패하지 않고,
    # Cartesian path lock을 잠시 풀어 초기 관측 Roll/Pitch로 복구한다.
    # 복구 과정에서 변한 XY는 저장된 목표를 기준으로 다시 보정한다.
    enable_roll_pitch_recovery: true
    # 한 검사 지점에서 허용하는 Roll/Pitch 자세 복구 횟수.
    roll_pitch_recovery_max_cycles: 2
    # 최종 단계에서 XY와 초기 Roll/Pitch를 동시에 만족시키기 위한 결합
    # 재검증 횟수. 한쪽 보정으로 다른 쪽이 변하면 최대 2회 다시 맞춘다.
    final_coupled_validation_max_cycles: 2
    # [m] 포트 기반 최종 flange 목표 Z의 절대 base Z 하한.
    # 위 minimum_target_z_m은 coarse 목표 검사용이고 이 값은 최종 목표 검사용이다.
    final_z_descent_minimum_z_m: 0.100
    # true이면 초기 /robot_arm/pbvs/port_pose_base Z를 저장하고 아래 식으로
    # 최종 flange Z를 자동 계산한다:
    # target_flange_z = port_z + tcp_offset_z - insertion_depth
    final_z_p_use_port_target: true
    # [m] 그리퍼를 완전히 닫은 상태에서 flange부터 수직 아래 USB 충전기
    # 단자 끝까지의 시험 실측 거리: 130mm.
    # X/Y 편심은 0이고 USB 축은 flange 축과 평행하다고 가정한다.
    final_tcp_offset_z_m: 0.130
    # [m] USB 끝이 포트 입구 평면보다 안쪽으로 들어갈 목표 깊이: 10mm.
    final_port_insertion_depth_m: 0.010
    # 힘/접촉 센서가 없으므로 최종 삽입은 기본 차단한다. TCP와 정렬을
    # 실측 확인한 뒤 true로 바꾸고 insert_step_once만 사용한다.
    enable_final_insertion: true
    # 한 번 승인할 때 0.5mm만 명령하고 실제 이동을 다시 측정한다.
    final_insertion_step_m: 0.0005
    final_insertion_speed: 1
    # 0.5mm 명령에 실제 2mm를 넘게 이동하면 후속 삽입을 차단한다.
    final_insertion_maximum_actual_step_m: 0.002
    final_insertion_target_tolerance_m: 0.0005
    # [m] final_z_p_use_port_target=false일 때만 쓰는 수동 fallback Z.
    final_z_p_target_z_m: 0.190
    # true이면 XY 수렴 후 초기 관측 keypoint angle로 Joint6 Yaw를 보정한다.
    enable_initial_yaw: true
    # [deg] 영상에서 USB 포트 장축이 정렬됐다고 보는 목표 각도.
    keypoint_desired_axis_deg: 0.0
    # [deg] 이보다 작은 Joint6 보정은 하드웨어 데드밴드로 보고 생략한다.
    minimum_yaw_step_deg: 3.0
    # [deg] frozen-target Yaw 단독/후속 보정의 1회 상한.
    # 실제 명령은 영상 오차*gain과 20도 중 작은 값이다.
    keypoint_maximum_step_deg: 20.0
    # [deg] 영상 장축 오차가 이 값 이하면 Yaw가 수렴했다고 본다.
    keypoint_tolerance_deg: 3.0
    # 영상 오차를 Joint6 명령 방향으로 바꾸는 부호.
    keypoint_command_sign: -1.0
    # 실측: 영상 +6.95deg에서 gain 1.32 명령 후 -1.97deg까지 이동했다.
    # 0deg 도달에 필요한 비율로 환산한 frozen-target 전용 gain.
    keypoint_joint_gain: 1.03
    # 로봇 Joint6 좌표계 방향. 반대로 회전하면 부호를 바꾼다.
    joint6_direction: -1.0
    # [deg] Joint6 절대 소프트 한계.
    joint6_limit_deg: 175.0
    # [s] Joint6 trajectory 목표 실행시간.
    joint6_move_seconds: 15.0
    # --- send_coords를 사용하지 않는 관절 Jacobian 수직 Z 단발 시험 ---
    # execute_once 성공 후 descend_joint_z_once 명령으로만 실행한다.
    enable_joint_vertical_descent: true
    # 절대경로 대신 ROS 패키지와 그 안의 상대경로로 URDF를 찾는다.
    joint_vertical_robot_description_package: mycobot_description
    joint_vertical_robot_description_relative_path: >-
      urdf/mycobot_280_m5/mycobot_280_m5.urdf
    # 남은 포트 목표 Z 오차에 적용할 P gain과 1회 최대 하강량.
    # 관절 명령의 하드웨어 오버슈팅을 감안한 현재 시험값은 6mm이다.
    joint_vertical_z_kp: 0.40
    joint_vertical_z_step_m: 0.006
    # Z 하강 후 send_coords Cartesian XY/Roll-Pitch 보정에 쓰는 P gain.
    # bridge의 완료 허용값(5mm/5도)보다 작은 부분 명령은 실제 보정 없이
    # 완료될 수 있어 첫 혼합 시험은 저장 목표를 직접 보내는 gain 1.0을 쓴다.
    joint_vertical_xy_kp: 1.00
    joint_vertical_orientation_kp: 1.00
    # Z 관절 Jacobian 단계는 현재 XY/R/P/Yaw를 유지하는 0 오차로 계산하고,
    # 초기 관측 R/P 복구는 Z 정지·측정 뒤 send_coords 단계에서만 수행한다.
    # 특이점 부근 관절 급변을 줄이는 damped least-squares 설정.
    joint_vertical_damping: 0.01
    # [m/rad] 자세 오차를 위치 오차와 함께 다루는 가중 길이 척도.
    joint_vertical_orientation_scale_m_per_rad: 0.05
    # [deg] 한 번의 계산에서 관절 하나가 움직일 수 있는 최대 각도.
    joint_vertical_max_joint_step_deg: 2.0
    # [deg] URDF 하드 관절 한계 안쪽에 남겨둘 여유.
    joint_vertical_joint_limit_margin_deg: 3.0
    # [s] 계산된 관절 목표를 send_angles로 실행할 목표 시간.
    joint_vertical_motion_seconds: 10.0
    # 실제 결과 안전 판정값. 초과 시 다음 관절 하강을 차단한다.
    joint_vertical_minimum_progress_m: 0.0005
    joint_vertical_maximum_overshoot_m: 0.003
    # true이면 혼합 XY/Roll/Pitch 보정의 결합 Z 이동으로 포트 기반 최종
    # Z 아래에 도달해도 실행을 거절하지 않고 경고만 남긴다. 과삽입을
    # 허용하는 시험 설정이며, 다른 무동작·관절·누적 하강 하드 한계는 유지한다.
    allow_mixed_correction_below_final_z: true
    # [m] 명령 초과가 있더라도 1회 실제 하강이 이 값을 넘으면 즉시 중단.
    joint_vertical_hard_maximum_descent_m: 0.015
    # 각 correction 단계가 실제로 실행되는 오차 deadband.
    joint_vertical_xy_correction_deadband_m: 0.003
    # 매 하강 사이클과 최종 안전 여유 도달 사이클에서 초기 관측 R/P와
    # 5도보다 차이나면 Cartesian R/P 보정을 수행한다.
    joint_vertical_roll_pitch_correction_deadband_deg: 5.0
    # R/P는 이 하드 한계까지 보정을 시도하고, 넘으면 즉시 중단한다.
    joint_vertical_roll_pitch_hard_limit_deg: 12.0
    # R/P 보정 후 최대 tilt 오차가 이 값 이상 감소해야 다음 사이클 허용.
    joint_vertical_minimum_tilt_improvement_deg: 0.2
    # XY/RP Cartesian 보정 중 결합 Z 변화의 경고 기준. 이 값만 넘었다고
    # 실패시키지 않고, 포트 기반 절대 목표 Z와 아래 안전 여유로 판단한다.
    joint_vertical_maximum_correction_z_drift_m: 0.005
    # [m] 포트 기반 최종 flange Z까지 이 거리 이내면 추가 R/P 복구와
    # 다음 관절 Z 사이클을 차단한다. 현재 12mm 내외 결합 이동을 고려해 15mm.
    joint_vertical_final_z_guard_m: 0.015
    # [m] Z+XY+R/P 한 사이클 전체에서 허용하는 절대 누적 하강 하드 한계.
    joint_vertical_hard_maximum_cycle_descent_m: 0.030
    # descend_joint_z_to_guard 한 명령에서 반복할 최대 혼합 P제어 사이클 수.
    joint_vertical_max_cycles: 8
    joint_vertical_xy_tolerance_m: 0.005
    joint_vertical_roll_pitch_tolerance_deg: 5.0
    # --- guard 도달 후 최종 Z-only 삽입 ---
    # true이면 insert_final_z_once 또는 execute_full_sequence_with_final_z로
    # 마지막 상대 Z 이동을 승인할 수 있다. 이 단계는 XY/Roll/Pitch를
    # 보정하지 않고 실제 오차만 최종 로그에 기록한다.
    enable_final_insertion_z: true
    # [m] guard 도달 자세에서 추가로 내릴 상대 거리: 10mm.
    # 포트 기반 configured 최종 flange Z가 더 위라면 그 위치에서 자른다.
    final_insertion_relative_distance_m: 0.010
    # [m] 상대 최종 Z 목표 완료 허용오차.
    final_insertion_tolerance_m: 0.002
    # [m] guard 시작점부터 단 한 번의 관절 명령으로 허용하는 실제 하강 한계.
    final_insertion_hard_maximum_total_descent_m: 0.015
    # true이면 마지막 Z-only 이동 뒤 제조사 actual XYZ/Yaw를 유지하는 목표에
    # 초기 관측 Roll/Pitch 전체값을 한 번 적용한다.
    enable_post_insertion_roll_pitch_recovery: true
    # PyMyCobot Cartesian 자세 복구 속도. 추가 Z 결합 이동은 제한하거나
    # 실패 조건으로 사용하지 않고 결과 로그에만 기록한다.
    post_insertion_roll_pitch_speed: 10
    # true이면 최종 Z 10mm → 초기 Roll/Pitch 복구 뒤 Z만 한 번 더 내린다.
    enable_post_recovery_final_z: true
    # [m] R/P 복구 뒤 상대 추가 하강 거리. 현재 시험값은 5mm이다.
    post_recovery_final_z_distance_m: 0.005

# 세션 중 기존 bridge를 유지한 채 초기 관측 관절 자세로 복귀하는 노드.
pinkk_return_to_observe:
  ros__parameters:
    # [deg] joint1~joint6 초기 관측 자세.
    observation_joint_degrees: [-1.66, -8.08, -36.65, -39.9, 0.0, 45.0]
    # [s] 초기 관측 자세 이동 목표 시간.
    motion_seconds: 20.0
    # [s] 초기 관측 자세 복귀 전 중단 여유 시간.
    warning_delay_seconds: 1.5
    # [deg] 제조사 하드웨어 반복오차를 고려한 복귀 완료 허용값.
    accepted_error_deg: 3.5
    # [s] 통합 trajectory bridge action이 나타날 때까지 기다리는 시간.
    bridge_wait_seconds: 60.0
