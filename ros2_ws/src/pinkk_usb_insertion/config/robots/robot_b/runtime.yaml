# Robot B 전용 덮어쓰기. 공통값은 ../../hybrid_runtime.yaml을 사용한다.
pinkk_usb_camera_node:
  ros__parameters:
    camera_device: /dev/v4l/by-id/usb-Sonix_Technology_Co.__Ltd._USB_2.0_Camera-video-index0

pinkk_port_pose_node:
  ros__parameters:
    # Robot B SolvePnP 포트 모델: 장축 18mm, 단축 10mm.
    port_model_width_m: 0.018
    port_model_height_m: 0.010

pinkk_frozen_target_executor_node:
  ros__parameters:
    # Robot B의 Git 기준값. Robot A의 Roll 시험 보정을 상속하지 않는다.
    fixed_roll_target_deg: -180.0
    # 첫 Robot B 시험은 Robot A와 같은 위치 편향에서 시작한다.
    # flange 로컬 +X 방향 TCP 편심 5mm.
    final_tcp_offset_x_m: 0.005
    final_tcp_offset_y_m: 0.000
    # Robot A와 같은 +2mm에서 실제 도착점이 포트 오른쪽으로 크게 남았고,
    # -3mm 시험에서도 장축 왼쪽 보정이 조금 더 필요해 -5mm를 사용한다.
    final_port_target_offset_x_m: -0.005
    # 단축 편향은 이번 장축 방향 시험에서 변경하지 않는다.
    final_port_target_offset_y_m: 0.005
