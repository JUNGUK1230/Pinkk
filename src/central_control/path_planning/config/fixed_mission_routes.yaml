# Fixed one-way mission chain in lidar_map_cm.
# START -> upper parking row -> chargers -> lower parking row -> EXIT
frame: lidar_map_cm
# 모든 pose 좌표는 카메라 localization 및 ROS 경로와 동일한 차량 중심 기준이다.
# 경로 생성기는 충돌·회전 기하 계산 직전에만 후륜축 기준으로 내부 변환한다.
waypoint_reference: vehicle_center
trajectory_reference: vehicle_center
rear_axle_to_center_cm: 4.0
# 기존 도로의 공통 회전반경이다. 삭제된 두 칸의 추가 여유는 전체 도로가
# 아니라 UPPER_TURN/LOWER_TURN 주변의 전용 waypoint에서만 사용한다.
road_turning_radius_cm: 16.0
# 삭제된 기존 상단 P6 자리 옆 코너만 빈 공간을 활용해 더 큰 반경으로
# 돈다. 하단 삭제 공간은 C1/C2의 exit 반경에서 사용한다.
road_corner_radii_cm:
  UPPER_TURN: 18.0
route_order: [START, P8, P7, P6, P5, UPPER_TURN, C1, C2, LOWER_TURN, P1, P2, P3, P4, EXIT]

# Slots are attached to these road-centre anchors. Passing traffic stays on the
# backbone and enters a slot's staging pose only when that slot is the target.
road_backbone:
  START: [70.8908226050, 26.6849615092, 0.8063000000]
  # C1/C2 이동 초반에 작은 좌우 곡률이 반복되지 않도록 START~P6를 하나의
  # 직선축으로 맞춘다. P8/P7은 기존 중심선에서 0.6cm 이내만 이동했다.
  P8: [99.4051564687, 50.5182290436, 0.7068946054]
  P7: [112.8048489981, 61.9634879056, 0.7068946054]
  P6: [125.5286175489, 72.8530071784, 0.7110000000]
  P5: [146.5243859897, 93.3687002477, 0.7048000000]
  # 삭제된 기존 상단 우측 주차면을 endpoint로 사용하지 않되, 우측 벽 바깥으로
  # 안전하게 돌아가는 공통 도로 형상은 transit waypoint로 유지한다.
  # C1에 주차된 차량과 통과 차량 사이의 중심선 여유를 확보하도록
  # 충전칸 앞 세로 통로를 camera BEV x=1000 px 선까지 안쪽으로 옮긴다.
  UPPER_TURN: [150.0409165522, 107.5757307135, 0.6987000000]
  C1: [131.6326807829, 123.6181730782, 2.2602000000]
  C2: [109.5287262875, 150.4319325249, 2.2602000000]
  # 삭제된 기존 하단 우측 주차면은 공통 도로 형상만 유지한다.
  LOWER_TURN: [82.4738463395, 122.1354290878, -2.4522000000]
  # 하단 주차열 앞은 P1~P4마다 다시 꺾지 않고 하나의 직선축을 공유한다.
  # C1/C2의 큰 하단 곡선을 빠져나온 뒤 이 축에서만 직진하고, 각 칸의
  # 마지막 주차 maneuver는 endpoint connector에서 별도로 수행한다.
  P1: [68.4371240925, 110.2048599141, -2.4521787849]
  P2: [54.7026240925, 98.8827599141, -2.4521787849]
  P3: [40.3727240925, 87.0699599141, -2.4521787849]
  P4: [26.8473240925, 75.9202599141, -2.4521787849]
  # EXIT 박스 안에서 P1~P4 공통 직선축을 그대로 연장한다. 따라서
  # camera BEV 기준 왼쪽을 바라본 채 제자리 회전 없이 도착한다.
  EXIT: [22.9135240925, 72.6774272046, -2.4521787849]

# START -> C1에서만 카메라 화면의 수평축을 정확히 따른다. LiDAR map은
# camera BEV에 대해 39.5005도 회전되어 있으므로 이 좌표들은 LiDAR에서는
# 대각선이지만 camera BEV에서는 같은 y 픽셀의 직선이다.
route_waypoint_sequences:
  START:
    C1:
    - [99.8630699474, 49.9637063359, 0.6894138687]
    - [113.4586990674, 61.1712793659, 0.6894138687]
    - [126.3793678774, 71.8224480759, 0.6894138687]

# C1 진입점이 이동해도 위 전용 직선을 목표 attachment까지 직접 늘이지
# 않고, 검증된 공통 도로의 이 지점에서 먼저 합류한 뒤 진입점으로 향한다.
route_waypoint_merge_points:
  START:
    C1: [140.5685067750, 87.9406105818]

# 충전칸에서 하단 주차열로 갈 때 직선과 원호를 조각조각 잇지 않는다.
# C1은 넓은 5차 Bezier, C2는 물리 회전반경을 지키는 단일 전진
# Reeds-Shepp 연결로 P1 합류점에 이어진다. 이후 P2~P4는 같은 직선을 공유한다.
smooth_road_connections:
  C1:
    targets: [P1, P2, P3, P4]
    merge_target: P1
    start_handle_cm: 8.0
    end_handle_cm: 8.0
  C2:
    targets: [P1, P2, P3, P4]
    merge_target: P1
    method: direction_only
    turning_radius_cm: 16.0

endpoints:
  START:
    staging: [70.8907942791, 26.6849243130, 0.8063000000]
    type: start
  P8:
    staging: [105.7662772626, 52.0268106737, 0.8013666733]
    # 도로에서 넓게 전진 정렬한 뒤 한 번의 연속 후진으로 진입한다.
    # 후진 구간은 조향 방향을 바꾸지 않는 원호+직선 형상이다.
    entry_staging: [96.2229299347, 51.4999138710, 0.6268337481]
    goal: [68.6197509063, 56.9772685880, -0.8566961161]
    entry_turning_radius_cm: 14.0
    entry_approach_turning_radius_cm: 14.0
    entry_attachment_search_cm: 60.0
    entry_final_straight_cm: 0.0
    type: parking
  P7:
    staging: [115.9503788682, 67.2448200906, 0.9758995985]
    entry_staging: [110.9482413018, 62.2783281359, 0.6268337481]
    goal: [82.6197509063, 67.9772685880, -0.8566961161]
    entry_turning_radius_cm: 14.0
    entry_approach_turning_radius_cm: 14.0
    entry_attachment_search_cm: 60.0
    entry_final_straight_cm: 0.0
    type: parking
  P6:
    staging: [128.4885006110, 77.6527421371, 1.0600812967]
    # P4처럼 칸 가까이에서 후진을 시작한다. 한 방향으로 약 19cm 회전한
    # 뒤 약 9cm 직선 후진하므로 긴 S자 후진과 반대조향이 발생하지 않는다.
    entry_staging: [120.0000000000, 68.0000000000, 0.0000000000]
    goal: [94.2001109488, 80.0742977406, -0.8597808805]
    entry_turning_radius_cm: 24.0
    entry_approach_turning_radius_cm: 22.0
    entry_attachment_search_cm: 60.0
    entry_final_straight_cm: 0.0
    type: parking
  P5:
    staging: [143.3691959570, 92.7224167865, 1.2217304764]
    entry_staging: [138.5722658224, 90.0278240759, 0.8726646260]
    goal: [110.5916623036, 90.9531513815, -0.8659515842]
    entry_turning_radius_cm: 14.0
    entry_approach_turning_radius_cm: 14.0
    entry_attachment_search_cm: 60.0
    entry_final_straight_cm: 0.0
    type: parking
  C1:
    # 충전 후 공통 도로로 복귀할 때 사용하는 출차 attachment 기준 자세다.
    staging: [129.4215801810, 125.1286880553, 2.5213431676]
    # 삭제된 기존 P6 공간 안쪽까지 전진한 뒤 넓은 반경으로 주차한다.
    # 삭제된 기존 P6 공간을 더 사용해 첫 후진을 약 41cm 유지한다.
    # 이동한 C1 중심까지 안전하게 연결하기 위해 cusp 오차를 16도 이내로
    # 허용하고, 이후 전진 정렬과 마지막 직선 후진에서 goal yaw를 맞춘다.
    # C1 접근 중 좌측 벽/주차 구획과의 명목 전방 여유를 약 2.5cm 늘린다.
    # 충전 접점에 더 가까워지도록 goal과 C1 영역을 차량 후방으로 1.5cm
    # 평행 이동한 뒤, camera BEV 화면 아래쪽으로 최종 0.4cm 이동했다.
    # 진입 전용 공간 안에서 entry staging 형상만 부드럽게 다시 정렬한다.
    # 진입 전진은 한 방향 원호에서 조향을 완전히 푼 뒤 18cm 직선으로
    # 자세를 정렬한다. 이전 L-S-R-S 형상의 마지막 반대 조향은 사용하지 않는다.
    entry_staging: [113.3748766373, 120.3976268941, 2.7052603406]
    # staging과 가까운 후반 도로점에서 다시 꺾지 않고, 원호가 시작되는
    # 검증된 공통도로 지점을 C1 전용 진입 attachment로 고정한다.
    entry_attachment_hint_cm: [137.7448618252, 85.1662377853]
    goal: [168.7804303131, 127.4643340989, -2.4696320774]
    # 차량 후미가 C1 경계를 통과하기 전에 goal yaw 정렬을 완료한다.
    # 마지막 44cm는 조향하지 않고 goal yaw를 유지한 직선 후진이다.
    entry_turning_radius_cm: 40.0
    entry_maximum_cusp_yaw_error_deg: 16.5
    entry_minimum_initial_reverse_cm: 50.0
    # 첫 후진 시작점을 앞으로 옮겨 길이를 늘리지 않는다. 대신 첫 후진
    # 끝점을 최종 후진축 너머로 5cm 더 통과시킨 뒤 저속 재전진으로
    # 축에 합류한다. 16도 자세 차이와 40cm 재전진 반경은 유지한다.
    # 이후 전진으로 축과 헤딩을 다시 맞춰 후진→전진 전환 직후의 급격한
    # 구동축 방향 변화를 줄인다. longitudinal 음수는 칸 반대쪽 방향이다.
    entry_cusp_relative_to_alignment:
      longitudinal_cm: -33.0
      lateral_cm: 11.5
      yaw_offset_deg: -16.0
    entry_approach_turning_radius_cm: 16.0
    # 별도의 짧은 직선과 재조향을 덧붙이지 않는다. 위 staging 자체가
    # 원호 뒤 18cm 직선의 끝이며 여기서 바로 후진으로 전환한다.
    entry_approach_final_straight_cm: 0.0
    entry_attachment_search_cm: 60.0
    # 충전 후 삭제된 하단 우측 칸 옆의 넓은 통로로 부드럽게 합류한다.
    exit_turning_radius_cm: 20.0
    entry_final_straight_cm: 44.0
    # camera BEV의 C1 사각형을 등록 affine으로 변환한 lidar_map_cm polygon.
    # 정렬 maneuver 중 차량 후미가 이 영역에 들어가는 후보는 폐기한다.
    entry_slot_polygon_cm:
    - [164.7183090726, 112.1735270889]
    - [180.3097098656, 124.7023227737]
    - [169.0530842237, 138.7504856130]
    - [153.4616834307, 126.2216899282]
    type: charging
  C2:
    # 차량 후미가 C2 경계를 통과하기 전에 goal yaw 정렬을 완료한다.
    # 새 camera_bev에서 검출한 C2 차량 중심에 맞춰 기존 박스를
    # camera 기준 오른쪽 11px, 아래 8px 이동했다. 등록 affine 기준
    # lidar_map_cm 이동량은 (+0.4249, +1.6462)cm이다.
    # C1과 동일하게 마지막 44cm는 goal yaw를 유지한 직선 후진이다.
    staging: [116.9441984011, 158.0807458757, 2.4347431207]
    # 삭제된 기존 P1 공간을 충분히 사용해 slot 앞에서 자세를 완성한다.
    # 첫 곡선 후진 뒤 C1과 비슷한 길이로 전진 정렬하고, 충분한 길이의
    # 직선 후진으로 진입한다.
    # C1과 비슷한 길이의 전진 정렬 구간을 확보하도록 빈 공간 안쪽의
    # staging을 사용한다.
    entry_staging: [88.8652594007, 134.2159041308, 2.7925268032]
    goal: [146.2858513869, 154.8681400862, -2.4696320774]
    entry_turning_radius_cm: 40.0
    # C1과 같은 3-point 형상: 충분히 첫 후진한 뒤 저속 재전진으로
    # 최종 후진축에 정렬하고, 직선 후진으로 충전 자세를 완성한다.
    entry_maximum_cusp_yaw_error_deg: 16.5
    entry_minimum_initial_reverse_cm: 50.0
    entry_cusp_relative_to_alignment:
      longitudinal_cm: -33.0
      lateral_cm: 11.5
      yaw_offset_deg: -16.0
    entry_approach_turning_radius_cm: 16.0
    entry_attachment_search_cm: 60.0
    exit_turning_radius_cm: 40.0
    entry_final_straight_cm: 44.0
    # camera BEV의 C2 사각형을 등록 affine으로 변환한 lidar_map_cm polygon.
    entry_slot_polygon_cm:
    - [141.6427118849, 139.9698067556]
    - [157.2341126779, 152.4986024404]
    - [145.9774870360, 166.5467652796]
    - [130.3860862430, 154.0179695949]
    type: charging
  P1:
    staging: [68.4371240925, 110.2048599141, -2.4521787849]
    # P1~P4 공통으로 주차열에서 camera 화면 아래쪽 벽 방향으로 8cm
    # 떨어진 뒤 후진을 시작해 급한 진입각을 완화한다.
    entry_staging: [66.4892689879, 120.2225072894, -2.9670597284]
    goal: [96.0698599141, 105.7684759074, 2.2602101955]
    entry_turning_radius_cm: 20.0
    entry_approach_turning_radius_cm: 20.0
    entry_attachment_search_cm: 60.0
    entry_final_straight_cm: 0.0
    type: parking
  P2:
    staging: [54.7026240925, 98.8827599141, -2.4521787849]
    entry_staging: [52.7547689879, 106.9004072894, -2.9670597284]
    goal: [81.6840599141, 94.4503759074, 2.2602101955]
    entry_turning_radius_cm: 20.0
    entry_approach_turning_radius_cm: 20.0
    entry_attachment_search_cm: 60.0
    entry_final_straight_cm: 0.0
    type: parking
  P3:
    staging: [40.3727240925, 87.0699599141, -2.4521787849]
    # 열린 공간에서 같은 조향 방향을 유지하는 원호와 직선으로 진입한다.
    # 모든 pose는 차량 중심 기준이다.
    entry_staging: [38.4248689879, 95.0876072894, -3.1415926536]
    goal: [66.6840599141, 83.4503759074, 2.2602101955]
    entry_turning_radius_cm: 28.0
    entry_approach_turning_radius_cm: 28.0
    entry_attachment_search_cm: 60.0
    entry_final_straight_cm: 0.0
    type: parking
  P4:
    staging: [26.8473240925, 75.9202599141, -2.4521787849]
    # 실차 시험에서 기존 후진 시작 중심(camera 약 x=143px)이 왼쪽 흰
    # 구획 구조물에 너무 가까워 바퀴가 걸렸다. 화면 오른쪽의 열린 도로
    # 방향으로 3.5cm 옮겨(camera 약 x=171px) 여유를 확보한다.
    entry_staging: [27.6001689879, 86.1642072894, -2.9670597284]
    goal: [55.0698599141, 70.7684759074, 2.2602101955]
    entry_turning_radius_cm: 16.0
    entry_approach_turning_radius_cm: 20.0
    entry_attachment_search_cm: 60.0
    entry_final_straight_cm: 0.0
    type: parking
  EXIT:
    staging: [22.9135240925, 72.6774272046, -2.4521787849]
    type: exit

allowed_transitions:
  START: [P8, P7, P6, P5, C1, C2]
  P8: [C1, C2, EXIT]
  P7: [C1, C2, EXIT]
  P6: [C1, C2, EXIT]
  P5: [C1, C2, EXIT]
  C1: [P1, P2, P3, P4, EXIT]
  C2: [P1, P2, P3, P4, EXIT]
  P1: [EXIT]
  P2: [EXIT]
  P3: [EXIT]
  P4: [EXIT]
