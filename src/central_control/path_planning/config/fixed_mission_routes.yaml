# Fixed one-way mission chain in lidar_map_cm.
# START -> upper parking row -> chargers -> lower parking row -> EXIT
frame: lidar_map_cm
# 아래 waypoint와 내부 충돌 검사는 rear axle 기하를 사용하지만, 생성 CSV와
# ROS 제어 경로는 차량 중심 기준으로 내보낸다.
trajectory_reference: vehicle_center
rear_axle_to_center_cm: 4.0
# 기존 도로의 공통 회전반경이다. 삭제된 두 칸의 추가 여유는 전체 도로가
# 아니라 UPPER_TURN/LOWER_TURN 주변의 전용 waypoint에서만 사용한다.
road_turning_radius_cm: 16.0
# 삭제된 기존 상단 P6 자리 옆 코너만 빈 공간을 활용해 더 큰 반경으로
# 돈다. 하단 삭제 공간은 C1/C2의 exit 반경에서 사용한다.
road_corner_radii_cm:
  UPPER_TURN: 18.0
route_order: [START, P8, P7, P6, P5, UPPER_TURN, C1, C2, LOWER_TURN, P1, P2, P3, P4, EXIT]

# Slots are attached to these road-centre anchors. Passing traffic stays on the
# backbone and enters a slot's staging pose only when that slot is the target.
road_backbone:
  START: [68.1221283259, 23.7980371962, 0.8063]
  # C1/C2 이동 초반에 작은 좌우 곡률이 반복되지 않도록 START~P6를 하나의
  # 직선축으로 맞춘다. P8/P7은 기존 중심선에서 0.6cm 이내만 이동했다.
  P8: [96.3636267999, 47.9203265677, 0.7068946054]
  P7: [109.7633193293, 59.3655854297, 0.7068946054]
  P6: [122.4977788963, 70.2426399510, 0.7110]
  P5: [143.4774214165, 90.7771742706, 0.7048]
  # 삭제된 기존 상단 우측 주차면을 endpoint로 사용하지 않되, 우측 벽 바깥으로
  # 안전하게 돌아가는 공통 도로 형상은 transit waypoint로 유지한다.
  # C1에 주차된 차량과 통과 차량 사이의 중심선 여유를 확보하도록
  # 충전칸 앞 세로 통로를 camera BEV x=1000 px 선까지 안쪽으로 옮긴다.
  UPPER_TURN: [146.9782004572, 105.0028393203, 0.6987]
  C1: [134.1769894005, 120.5316712301, 2.2602]
  C2: [112.0730349051, 147.3454306768, 2.2602]
  # 삭제된 기존 하단 우측 주차면은 공통 도로 형상만 유지한다.
  LOWER_TURN: [85.5603762247, 124.6797036932, -2.4522]
  P1: [71.4444464077, 112.7192260522, -2.4522]
  P2: [57.5096776850, 101.7180740378, -2.4522]
  P3: [42.5021892191, 90.6426094901, -2.4522]
  P4: [30.5095590496, 77.6785265447, -2.4522]
  EXIT: [23.2712034889, 76.8954852119, -3.0299]

# START -> C1에서만 카메라 화면의 수평축을 정확히 따른다. LiDAR map은
# camera BEV에 대해 39.5005도 회전되어 있으므로 이 좌표들은 LiDAR에서는
# 대각선이지만 camera BEV에서는 같은 y 픽셀의 직선이다.
route_waypoint_sequences:
  START:
    C1:
    - [96.7765940400, 47.4193662500, 0.6894138687]
    - [110.3722231600, 58.6269392800, 0.6894138687]
    - [123.2928919700, 69.2781079900, 0.6894138687]

# C1 진입점이 이동해도 위 전용 직선을 목표 attachment까지 직접 늘이지
# 않고, 검증된 공통 도로의 이 지점에서 먼저 합류한 뒤 진입점으로 향한다.
route_waypoint_merge_points:
  START:
    C1: [140.5685067750, 87.9406105818]

endpoints:
  START:
    staging: [68.1221, 23.7980, 0.8063]
    type: start
  P8:
    # 기어 반전 중 차동 회전이 늦게 형성되는 실차 특성을 고려해 첫 곡선
    # 후진에서 자세를 더 만든 뒤 전진 정렬한다.
    staging: [102.9833745923, 49.1535803092, 0.8013666733]
    goal: [66.0, 60.0, -0.8566961161]
    entry_turning_radius_cm: 14.0
    entry_from_staging: true
    entry_maximum_cusp_yaw_error_deg: 12.0
    entry_minimum_initial_reverse_cm: 24.5
    entry_final_straight_cm: 32.0
    type: parking
  P7:
    staging: [113.7086859594, 63.9319945741, 0.9758995985]
    goal: [80.0, 71.0, -0.8566961161]
    entry_turning_radius_cm: 16.0
    road_attachment_entry_turning_radius_cm: 14.0
    entry_from_staging: true
    entry_maximum_cusp_yaw_error_deg: 20.0
    entry_minimum_initial_reverse_cm: 25.5
    entry_final_straight_cm: 28.0
    type: parking
  P6:
    staging: [126.5332959685, 74.1631612445, 1.0600812967]
    goal: [91.5896969065, 83.1050960723, -0.8597808805]
    entry_turning_radius_cm: 14.0
    entry_from_staging: true
    entry_maximum_cusp_yaw_error_deg: 8.0
    entry_minimum_initial_reverse_cm: 25.5
    entry_final_straight_cm: 28.0
    type: parking
  P5:
    # 삭제된 우측 공간을 사용해 작은 cusp 오차로 차체를 정렬한다.
    staging: [142.0011153837, 88.9636463034, 1.2217304764]
    goal: [108.0, 94.0, -0.8659515842]
    entry_turning_radius_cm: 14.0
    entry_from_staging: true
    entry_maximum_cusp_yaw_error_deg: 12.0
    entry_minimum_initial_reverse_cm: 27.5
    entry_final_straight_cm: 26.0
    type: parking
  C1:
    # 충전 후 공통 도로로 복귀할 때 사용하는 출차 attachment 기준 자세다.
    staging: [132.6765140658, 122.8037352804, 2.5213431676]
    # 삭제된 기존 P6 공간 안쪽까지 전진한 뒤 넓은 반경으로 주차한다.
    # 삭제된 기존 P6 공간을 더 사용해 첫 후진을 약 41cm 유지한다.
    # 이동한 C1 중심까지 안전하게 연결하기 위해 cusp 오차를 16도 이내로
    # 허용하고, 이후 전진 정렬과 마지막 직선 후진에서 goal yaw를 맞춘다.
    # C1 접근 중 좌측 벽/주차 구획과의 명목 전방 여유를 약 2.5cm 늘린다.
    # 충전 접점에 더 가까워지도록 goal과 C1 영역을 차량 후방으로 1.5cm
    # 평행 이동한 뒤, camera BEV 화면 아래쪽으로 최종 0.4cm 이동했다.
    # 진입 전용 공간 안에서 entry staging 형상만 부드럽게 다시 정렬한다.
    # 진입 전진은 한 방향 원호에서 조향을 완전히 푼 뒤 18cm 직선으로
    # 자세를 정렬한다. 이전 L-S-R-S 형상의 마지막 반대 조향은 사용하지 않는다.
    entry_staging: [117.0001077855, 118.7071538472, 2.7052603406]
    # staging과 가까운 후반 도로점에서 다시 꺾지 않고, 원호가 시작되는
    # 검증된 공통도로 지점을 C1 전용 진입 attachment로 고정한다.
    entry_attachment_hint_cm: [137.7448618252, 85.1662377853]
    goal: [171.9108409926, 129.9544202375, -2.4696320774]
    # 차량 후미가 C1 경계를 통과하기 전에 goal yaw 정렬을 완료한다.
    # 마지막 44cm는 조향하지 않고 goal yaw를 유지한 직선 후진이다.
    entry_turning_radius_cm: 40.0
    entry_maximum_cusp_yaw_error_deg: 16.5
    entry_minimum_initial_reverse_cm: 50.0
    # 첫 후진 시작점을 앞으로 옮겨 길이를 늘리지 않는다. 대신 첫 후진
    # 끝점을 최종 후진축 너머로 5cm 더 통과시킨 뒤 저속 재전진으로
    # 축에 합류한다. 16도 자세 차이와 40cm 재전진 반경은 유지한다.
    # 이후 전진으로 축과 헤딩을 다시 맞춰 후진→전진 전환 직후의 급격한
    # 구동축 방향 변화를 줄인다. longitudinal 음수는 칸 반대쪽 방향이다.
    entry_cusp_relative_to_alignment:
      longitudinal_cm: -33.0
      lateral_cm: 11.5
      yaw_offset_deg: -16.0
    entry_approach_turning_radius_cm: 16.0
    # 별도의 짧은 직선과 재조향을 덧붙이지 않는다. 위 staging 자체가
    # 원호 뒤 18cm 직선의 끝이며 여기서 바로 후진으로 전환한다.
    entry_approach_final_straight_cm: 0.0
    entry_attachment_search_cm: 60.0
    # 충전 후 삭제된 하단 우측 칸 옆의 넓은 통로로 부드럽게 합류한다.
    exit_turning_radius_cm: 20.0
    entry_final_straight_cm: 44.0
    # camera BEV의 C1 사각형을 등록 affine으로 변환한 lidar_map_cm polygon.
    # 정렬 maneuver 중 차량 후미가 이 영역에 들어가는 후보는 폐기한다.
    entry_slot_polygon_cm:
    - [164.7183090726, 112.1735270889]
    - [180.3097098656, 124.7023227737]
    - [169.0530842237, 138.7504856130]
    - [153.4616834307, 126.2216899282]
    type: charging
  C2:
    # 차량 후미가 C2 경계를 통과하기 전에 goal yaw 정렬을 완료한다.
    # C1과 동일하게 마지막 38cm는 goal yaw를 유지한 직선 후진이다.
    staging: [119.5609540908, 153.8367446119, 2.4347431207]
    # 삭제된 기존 P1 공간을 충분히 사용해 slot 앞에서 자세를 완성한다.
    # 첫 곡선 후진 뒤 C1과 비슷한 길이로 전진 정렬하고, 충분한 길이의
    # 직선 후진으로 진입한다.
    # C1과 비슷한 길이의 전진 정렬 구간을 확보하도록 빈 공간 안쪽의
    # staging을 사용한다.
    entry_staging: [92.1991388139, 131.2015876775, 2.7925268032]
    goal: [148.9913709964, 155.7119903448, -2.4696320774]
    entry_turning_radius_cm: 40.0
    entry_maximum_cusp_yaw_error_deg: 10.0
    entry_approach_turning_radius_cm: 16.0
    entry_attachment_search_cm: 60.0
    exit_turning_radius_cm: 40.0
    entry_final_straight_cm: 38.0
    # camera BEV의 C2 사각형을 등록 affine으로 변환한 lidar_map_cm polygon.
    entry_slot_polygon_cm:
    - [141.2178208149, 138.3235708756]
    - [156.8092216079, 150.8523665604]
    - [145.5525959660, 164.9005293996]
    - [129.9611951730, 152.3717337149]
    type: charging
  P1:
    staging: [71.5235898105, 112.7491991003, -2.4521787849]
    goal: [99.0, 103.0, 2.2602101955]
    type: parking
  P2:
    staging: [57.5235898105, 101.7491991003, -2.4521787849]
    goal: [85.0, 92.0, 2.2602101955]
    type: parking
  P3:
    staging: [42.5235898105, 90.7491991003, -2.4521787849]
    goal: [70.0, 81.0, 2.2602101955]
    type: parking
  P4:
    staging: [30.5235898105, 77.7491991003, -2.4521787849]
    goal: [58.0, 68.0, 2.2602101955]
    type: parking
  EXIT:
    staging: [23.27120352, 76.89548524, -3.0299]
    type: exit

allowed_transitions:
  START: [P8, P7, P6, P5, C1, C2]
  P8: [C1, C2]
  P7: [C1, C2]
  P6: [C1, C2]
  P5: [C1, C2]
  C1: [P1, P2, P3, P4]
  C2: [P1, P2, P3, P4]
  P1: [EXIT]
  P2: [EXIT]
  P3: [EXIT]
  P4: [EXIT]
