vehicle:
  length_cm: 12.0
  # 실차 측정 폭. Hybrid A*는 이 실제 차체 외곽 자체로 벽 충돌을 검사한다.
  width_cm: 10.0
  # DD의 2.7cm 값은 wheel radius이며 자동차식 wheelbase가 아니다.
  wheel_radius_cm: 2.7
  wheel_separation_cm: 9.61
  # Hybrid A*의 bicycle-equivalent 모델에는 구동축-캐스터 거리 6.95cm를 쓴다.
  wheelbase_cm: 6.95
  # Hybrid A* pose는 뒷바퀴 축 중심이며, rear overhang부터 차체 전체를 검사한다.
  rear_overhang_cm: 2.0
  max_steer_deg: 30.0
  # 실차 저속 원주 주행 기준 최소 회전반경.
  min_turning_radius_cm: 12.0
  allow_reverse: true
