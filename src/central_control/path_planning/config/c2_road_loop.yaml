# Camera BEV registration으로 실측한 전진 전용 도로 중앙선 초안.
# 순서대로 연결하면 C2 staging을 포함하는 시계방향 loop가 된다.
frame: lidar_map_cm
start_points:
  entrance:
    # parking_points (1).json / entrance.center_bev=[100, 120]에 현재
    # camera-to-LiDAR rigid registration을 적용한 LiDAR map cm 좌표다.
    x_cm: 68.1221
    y_cm: 23.7980
    # Camera BEV에서 C1 방향(오른쪽)을 향하는 초기 heading.
    yaw_deg: 46.2
    entry_loop_node: north_west
loop_nodes:
  - {id: north_right, x_cm: 151.4, y_cm: 102.2}
  - {id: c2_approach_1, x_cm: 141.9, y_cm: 113.8}
  - {id: c2_approach_2, x_cm: 135.5, y_cm: 121.5}
  - {id: c2_approach_3, x_cm: 126.0, y_cm: 133.0}
  - {id: c2_staging, x_cm: 116.4906, y_cm: 144.6336}
  - {id: south_right, x_cm: 111.7, y_cm: 150.4}
  - {id: south_east, x_cm: 100.0, y_cm: 142.4}
  - {id: south_mid_east, x_cm: 82.6, y_cm: 128.1}
  - {id: south_mid, x_cm: 60.6, y_cm: 111.5}
  - {id: south_mid_west, x_cm: 41.3, y_cm: 95.6}
  - {id: south_west, x_cm: 23.1, y_cm: 77.4}
  - {id: west_lower, x_cm: 36.9, y_cm: 59.7}
  - {id: west_mid, x_cm: 48.9, y_cm: 45.2}
  - {id: west_upper, x_cm: 60.8, y_cm: 30.7}
  - {id: north_west, x_cm: 75.5, y_cm: 31.5}
  - {id: north_mid_west, x_cm: 96.7, y_cm: 48.1}
  - {id: north_mid, x_cm: 120.4, y_cm: 68.5}
  - {id: north_east, x_cm: 139.3, y_cm: 84.9}
  - {id: east_upper, x_cm: 151.7, y_cm: 99.2}
