realtime_localization:
  model_path: src/central_control/models/best.pt
  calibration_path: src/central_control/camera_tools/first_map/camera_calibration.npz
  homography_path: src/central_control/camera_tools/first_map/bev_homography.npz
  registration_path: src/central_control/camera_tools/first_map/camera_to_lidar_rigid_registration.npz
  parking_slots_path: src/central_control/config/map/parking_slots_bev.json
  parking_points_path: src/central_control/config/map/parking_points.json
  vehicle_config_path: src/central_control/path_planning/config/vehicle_config.yaml
  scene_output_path: src/central_control/path_planning/output/live_vision_scene.json
  bev_output_path: src/central_control/path_planning/output/live_camera_bev.png

  camera_id: 2
  camera_width: 1920
  camera_height: 1080
  camera_fps: 30
  camera_fourcc: MJPG

  confidence: 0.25
  iou: 0.45
  occupancy_threshold: 0.10
  output_every_n_frames: 1

  # 입구 차량의 첫 에피소드: 입구에서 먼 P6~P10 빈 칸을 우선 선택한다.
  # P6~P10 중 점유된 칸은 건너뛰며, 최대 5개 후보를 scene에 기록한다.
  parking_assignment:
    active_phase: entry_to_parking
    phases:
      entry_to_parking:
        reference_point: entrance
        allowed_slots: [P6, P7, P8, P9, P10]
        preference: farthest
        candidate_limit: 5
      charge_to_exit:
        reference_point: exit
        allowed_slots: [P1, P2, P3, P4, P5]
        preference: nearest
        candidate_limit: 5

  # 특정 칸을 강제하려면 이름을 넣는다. 현재는 자동 배정을 사용한다.
  target_slot_name: null

  # 검증된 자동 Hybrid 경로를 localization 창에 빨간 선으로 표시한다.
  planned_path_path: src/central_control/path_planning/output/live_hybrid_path_world_cm.json

  # 여러 car가 보일 때 ego를 구분하려면 실제 초기 BEV 중심을 [x, y]로 입력한다.
  # null이면 첫 프레임에서 confidence가 가장 높은 car를 표시하지만 planning_ready=false이다.
  initial_ego_center_bev_px: null

  # 기본 null: 실행 창에서 h를 누르고 차량 앞쪽을 클릭해 heading을 지정한다.
  # 숫자를 넣으면 기존 CLI/설정 기반 초기 heading 방식도 사용할 수 있다.
  initial_ego_yaw_deg: null

  position_filter_alpha: 0.5
  yaw_filter_alpha: 0.35
  max_center_jump_px: 250.0
  minimum_mask_elongation: 1.05
