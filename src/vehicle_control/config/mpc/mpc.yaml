pinkk_mpc_path_follower:
  ros__parameters:
    # MPC가 감시할 설정 파일 경로다. 상대 경로는 ~/PINKK에서 실행하는 기준이다.
    # 이 경로 자체를 바꾸면 노드를 재시작해야 한다.
    tuning_file: src/vehicle_control/config/mpc/mpc.yaml
    # true이면 tuning_file의 저장 시각을 감시해 변경된 전체 설정을 자동 반영한다.
    auto_reload_tuning: true
    # [s] 설정 파일 변경 여부를 확인하는 주기다. 변경 시 노드 재시작이 필요하다.
    tuning_reload_period_sec: 1.0

    # 중앙제어가 [x_m, y_m, yaw_rad, direction] 배열로 발행하는 고정 경로 토픽이다.
    # 토픽을 바꾸면 subscription 재생성을 위해 노드를 재시작해야 한다.
    trajectory_topic: /pinkk/planned_trajectory
    # false 수신 시 현재 경로와 MPC 진행 상태를 즉시 폐기하고 정지하는 토픽이다.
    # 토픽을 바꾸면 노드를 재시작해야 한다.
    path_valid_topic: /pinkk/path_valid
    # MPC가 사용할 rear-axle pose 토픽이다. 현재는 카메라 x/y와 LiDAR/odom
    # heading을 결합한 lidar_map 좌표 pose를 사용한다. 변경 시 재시작해야 한다.
    pose_topic: /pinkk/fused_vehicle_pose

    # 실차 pinky_bringup으로 선속도와 각속도를 보낼 출력 토픽이다.
    # 다른 주행 제어기와 동시에 사용하지 말며, 변경 시 노드를 재시작해야 한다.
    cmd_vel_topic: /cmd_vel
    # true이면 /cmd_vel에 다른 publisher가 발견될 때 충돌로 판단하고 정지한다.
    reject_cmd_vel_conflicts: true
    # MPC 지도 각속도에 곱해 ROS angular.z로 보내는 부호다. 허용값은 -1 또는 1.
    # lidar_map은 시계방향 yaw가 양수이고 ROS는 반시계방향이 양수라 현재는 -1이다.
    # 차량이 명령과 정확히 반대 방향으로 회전한다는 것이 확인된 경우에만 바꾼다.
    angular_command_sign: -1.0

    # 장애물 안전정지에 사용할 LaserScan 토픽이다. 변경 시 재시작해야 한다.
    scan_topic: /scan
    # true이면 scan이 없거나 오래됐거나 유효 sector가 없을 때 무조건 정지한다.
    # 실차에서는 안전을 위해 true를 유지한다.
    require_scan: true
    # [s] 마지막 scan 수신 이후 이 시간을 넘으면 SCAN_TIMEOUT으로 정지한다.
    scan_timeout_sec: 0.8
    # [deg] 전방 중심각 좌우로 검사할 반각이다. 18이면 전체 전방 sector는 36도다.
    # 크게 하면 측면 벽도 장애물로 감지할 가능성이 커진다.
    front_scan_half_angle_deg: 18.0
    # [deg] 후방 중심각 좌우로 검사할 반각이다. 30이면 전체 후방 sector는 60도다.
    rear_scan_half_angle_deg: 30.0
    # [deg] LaserScan 좌표에서 차체 전방이 위치한 중심각이다.
    # Pinky LiDAR가 차체와 180도 방향으로 장착되어 현재 전방은 180도다.
    front_scan_center_deg: 180.0
    # [deg] LaserScan 좌표에서 차체 후방이 위치한 중심각이다.
    rear_scan_center_deg: 0.0
    # [m] 전진 중 전방 sector 최소 거리가 이 값 이하이면 즉시 정지한다.
    # 너무 크게 하면 벽 가까운 정상 경로에서도 일찍 멈춘다.
    front_stop_distance_m: 0.15
    # [m] 후진 중 후방 sector 최소 거리가 이 값 이하이면 즉시 정지한다.
    rear_stop_distance_m: 0.12

    # [Hz] MPC 계산 및 cmd_vel 발행 주기다. 높이면 반응 주기가 빨라지지만
    # CPU가 제한 시간 안에 최적화를 끝내지 못할 수 있다.
    control_frequency_hz: 4.0
    # [s] MPC 내부 차량 모델의 한 예측 step 시간이다.
    # 총 예측 시간은 dt_sec × horizon_steps이며 현재는 2.5초다.
    dt_sec: 0.25
    # 예측할 step 수다. 늘리면 먼 코너를 보지만 계산량과 지연이 증가한다.
    horizon_steps: 10
    # SLSQP 최적화가 한 제어 주기에서 수행할 최대 반복 횟수다.
    # 늘리면 수렴 가능성은 높아지지만 계산 시간이 길어진다.
    solver_max_iterations: 45
    # 최적화 종료 허용오차다. 작게 하면 더 정밀하지만 계산 시간이 늘 수 있다.
    solver_ftol: 0.00001

    # [m/s] 전진 경로에서 따라가려는 기준 속도다.
    # max_forward_speed_mps보다 클 수 없다.
    forward_speed_mps: 0.06
    # [m/s] 후진 경로에서 따라가려는 속도의 절댓값이다.
    # 실제 cmd_vel에는 음수로 출력되며 max_reverse_speed_mps보다 클 수 없다.
    reverse_speed_mps: 0.02
    # [m/s] 최적화가 허용하는 최대 전진 속도다.
    max_forward_speed_mps: 0.08
    # [m/s] 최적화가 허용하는 최대 후진 속도의 절댓값이다.
    max_reverse_speed_mps: 0.03
    # [m/s²] 연속 제어 step 사이 선속도 변화 한계다.
    # 작게 하면 출발·감속이 부드럽지만 반응이 느리고, 크게 하면 급격해진다.
    max_acceleration_mps2: 0.12
    # [1/m] 전체 경로에서 허용하는 최대 곡률이다. 최소 회전반경은 1/곡률이며
    # 현재 7.0은 약 14.3cm 반경이다. 차량의 실제 회전 능력을 넘기지 않는다.
    max_curvature_1pm: 7.0
    # [1/(m·s)] 시간당 곡률 명령 변화 한계다. 낮추면 조향이 부드럽지만
    # 코너 반응이 늦고, 높이면 빠르지만 좌우 진동 가능성이 커진다.
    max_curvature_rate_1pmps: 10.0
    # [rad/s] 최종 ROS 각속도의 절댓값 한계다.
    # angular speed = linear speed × curvature 관계에도 이 제한이 적용된다.
    max_angular_speed_radps: 0.35
    # [1/m] 경로 기준 곡률이 이 값 이하일 때 직선 후보로 판정한다.
    # 크게 하면 완만한 곡선도 직선 제한을 적용받을 수 있다.
    straight_curvature_threshold_1pm: 0.35
    # [1/m] 직선으로 판정된 구간에서 허용할 최대 보정 곡률이다.
    # 현재 3.0은 약 33.3cm 반경이며, 낮추면 부드럽지만 횡오차 복귀가 느려진다.
    straight_max_curvature_1pm: 3.0
    # [deg] 직선 제한 구간에서 차량 yaw와 가장 가까운 경로 yaw의 오차가
    # 이 값을 넘으면 HEADING_ERROR_TOO_LARGE로 정지한다.
    max_tracking_yaw_error_deg: 25.0

    # [s] fused pose가 이 시간보다 오래 갱신되지 않으면 POSE_TIMEOUT으로 정지한다.
    pose_timeout_sec: 0.6
    # [s] 고정 경로가 이 시간보다 오래 재발행되지 않으면 PATH_TIMEOUT으로 정지한다.
    path_timeout_sec: 2.5
    # [s] 전진↔후진 direction 전환점에서 완전히 정지해 기다리는 시간이다.
    gear_pause_sec: 0.7
    # [m] 최종 경로점까지 이 거리 이내이고 yaw 오차도 허용 범위 이내이면
    # GOAL_REACHED로 판단한다.
    goal_position_tolerance_m: 0.025
    # [deg] 최종 위치에서 허용하는 경로 종점 yaw 오차다.
    goal_yaw_tolerance_deg: 8.0
    # [m] direction 전환점까지 이 거리 이내일 때 GEAR_CHANGE_REQUIRED를 발생시킨다.
    # 너무 크면 전환점에 도달하기 전에 후진하고, 너무 작으면 전환이 어려울 수 있다.
    gear_position_tolerance_m: 0.01
    # 현재 progress에서 앞으로 가장 가까운 경로점을 검색할 최대 점 개수다.
    # 경로점 간격 기준의 개수이며 m 단위가 아니다.
    nearest_forward_window: 140
    # 현재 progress보다 뒤쪽으로 가장 가까운 점을 다시 찾도록 허용하는 점 개수다.
    # 크게 하면 위치 노이즈에서 progress가 뒤로 흔들릴 가능성이 커진다.
    nearest_backward_window: 4

    # 경로 yaw로 계산한 feed-forward 곡률의 이동평균 점 개수다.
    # 양의 홀수만 허용한다. 크게 하면 부드럽지만 코너 진입 반응이 늦어진다.
    curvature_smoothing_points: 5
    # 직선 판정 시 MPC 예측 참조 중 앞에서 검사할 점 개수다.
    # 늘리면 앞쪽 곡선을 더 일찍 발견해 직선 곡률 제한을 미리 해제한다.
    straight_lookahead_points: 4
    # 직선 판정 시 현재 progress 뒤쪽에서 곡률 이력을 검사할 점 개수다.
    # 늘리면 코너 통과 후에도 전체 곡률 허용 상태를 더 오래 유지한다.
    straight_history_points: 12
    # direction 구간 끝까지 남은 점이 이 개수보다 적으면 직선 곡률 제한을
    # 해제한다. 늘리면 전환점·종점 접근 시 더 일찍 큰 곡률을 허용한다.
    straight_end_guard_points: 30

    # 예측 horizon의 각 step에서 x/y 위치 오차에 주는 비용이다.
    # 올리면 경로 위치 복귀를 우선하지만 조향이 공격적일 수 있다.
    weight_position: 200.0
    # 예측 horizon의 각 step에서 yaw 오차에 주는 비용이다.
    # 올리면 경로 방향을 강하게 맞추지만 횡오차 보정과 충돌할 수 있다.
    weight_yaw: 2.0
    # horizon 마지막 예측점의 x/y 위치 오차 비용이다.
    # 올리면 예측 끝 위치를 경로에 강하게 맞추려 한다.
    weight_terminal_position: 500.0
    # horizon 마지막 예측점의 yaw 오차 비용이다.
    weight_terminal_yaw: 5.0
    # 기준 속도와 예측 속도의 차이에 주는 비용이다.
    # 올리면 설정 속도를 잘 유지하고, 내리면 오차 보정을 위해 감속하기 쉬워진다.
    weight_speed: 50.0
    # 경로 feed-forward 곡률과 예측 곡률 차이에 주는 비용이다.
    # 올리면 경로 자체의 곡률을 더 따르고 횡오차에 의한 추가 보정은 약해진다.
    weight_curvature: 0.08
    # 연속 예측 step의 속도 변화에 주는 비용이다.
    # 올리면 가감속이 부드럽지만 속도 반응이 느려진다.
    weight_speed_rate: 1.0
    # 연속 예측 step의 곡률 변화에 주는 비용이다.
    # 올리면 좌우 진동이 줄지만 코너·횡오차 반응이 느려진다.
    weight_curvature_rate: 0.04
