<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>스마트 주차 관제 시스템</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family:
                Pretendard,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: #0f172a;
            color: #f8fafc;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 20px 32px;
            border-bottom: 1px solid #334155;
            background: #111827;
        }

        header h1 {
            font-size: 24px;
        }

        .system-status {
            display: flex;
            align-items: center;
            gap: 8px;

            padding: 8px 14px;
            border-radius: 20px;
            background: #1e293b;
            font-size: 14px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 10px #22c55e;
        }

        main {
            display: grid;
            grid-template-columns: minmax(0, 2fr) minmax(320px, 1fr);
            gap: 24px;

            max-width: 1500px;
            margin: 0 auto;
            padding: 24px;
        }

        .card {
            padding: 20px;
            border: 1px solid #334155;
            border-radius: 18px;
            background: #1e293b;
            box-shadow: 0 10px 25px rgb(0 0 0 / 20%);
        }

        .card-title {
            margin-bottom: 16px;
            font-size: 18px;
            font-weight: 700;
        }

        .camera-card {
            min-height: 650px;
        }

        .camera-container {
            position: relative;
            overflow: hidden;

            width: 100%;
            height: 570px;

            border: 2px solid #334155;
            border-radius: 14px;
            background: #020617;
        }

        .camera-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .camera-label {
            position: absolute;
            top: 14px;
            left: 14px;

            padding: 7px 12px;
            border-radius: 8px;
            background: rgb(0 0 0 / 65%);
            font-size: 13px;
        }

        .live-indicator {
            color: #ef4444;
            font-weight: 700;
        }

        .right-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .vehicle-name {
            margin-bottom: 18px;
            color: #94a3b8;
            font-size: 14px;
        }

        .battery-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 10px;
        }

        .battery-value {
            font-size: 26px;
            font-weight: 800;
        }

        .battery-track {
            overflow: hidden;

            width: 100%;
            height: 24px;

            border-radius: 12px;
            background: #334155;
        }

        .battery-fill {
            width: 78%;
            height: 100%;

            border-radius: 12px;
            background: linear-gradient(
                90deg,
                #22c55e,
                #84cc16
            );

            transition:
                width 0.4s ease,
                background 0.4s ease;
        }

        .battery-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;

            margin-top: 18px;
        }

        .detail-box {
            padding: 14px;
            border-radius: 12px;
            background: #0f172a;
        }

        .detail-label {
            margin-bottom: 5px;
            color: #94a3b8;
            font-size: 12px;
        }

        .detail-value {
            font-size: 16px;
            font-weight: 700;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .control-button {
            min-height: 80px;
            border: none;
            border-radius: 14px;

            color: white;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;

            transition:
                transform 0.15s ease,
                filter 0.15s ease;
        }

        .control-button:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        .control-button:active {
            transform: translateY(0);
        }

        .control-button:disabled {
            cursor: not-allowed;
            filter: grayscale(0.8);
            opacity: 0.5;
            transform: none;
        }

        .entry-button {
            background: #2563eb;
        }

        .exit-button {
            background: #dc2626;
        }

        .route-status {
            padding: 16px;
            border-left: 5px solid #64748b;
            border-radius: 10px;
            background: #0f172a;
        }

        .route-status.processing {
            border-left-color: #f59e0b;
        }

        .route-status.success {
            border-left-color: #22c55e;
        }

        .route-status.error {
            border-left-color: #ef4444;
        }

        .route-status-title {
            margin-bottom: 6px;
            font-size: 15px;
            font-weight: 800;
        }

        .route-status-message {
            color: #cbd5e1;
            font-size: 14px;
            line-height: 1.5;
        }

        .route-info {
            display: grid;
            gap: 10px;

            margin-top: 16px;
        }

        .route-info-row {
            display: flex;
            justify-content: space-between;

            padding-bottom: 10px;
            border-bottom: 1px solid #334155;
        }

        .route-info-row:last-child {
            padding-bottom: 0;
            border-bottom: none;
        }

        .route-info-label {
            color: #94a3b8;
        }

        .route-info-value {
            font-weight: 700;
        }

        @media (max-width: 900px) {
            main {
                grid-template-columns: 1fr;
            }

            .camera-card {
                min-height: auto;
            }

            .camera-container {
                height: 430px;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>스마트 주차 관제 시스템</h1>

        <div class="system-status">
            <span class="status-dot"></span>
            <span id="systemStatusText">시스템 정상</span>
        </div>
    </header>

    <main>
        <!-- 상단 카메라 화면 -->
        <section class="card camera-card">
            <h2 class="card-title">주차장 실시간 화면</h2>

            <div class="camera-container">
                <!-- Flask 카메라 영상 주소 -->
                <img
                    src="/video_feed"
                    alt="상단 카메라 영상"
                    onerror="cameraError()"
                >

                <div class="camera-label">
                    <span class="live-indicator">● LIVE</span>
                    상단 카메라
                </div>
            </div>
        </section>

        <aside class="right-panel">
            <!-- 배터리 상태 -->
            <section class="card">
                <h2 class="card-title">차량 상태</h2>

                <p class="vehicle-name">
                    차량 ID: <strong id="vehicleId">PINKY_01</strong>
                </p>

                <div class="battery-header">
                    <span>배터리 잔량</span>
                    <span
                        class="battery-value"
                        id="batteryValue"
                    >
                        78%
                    </span>
                </div>

                <div class="battery-track">
                    <div
                        class="battery-fill"
                        id="batteryFill"
                    ></div>
                </div>

                <div class="battery-details">
                    <div class="detail-box">
                        <div class="detail-label">충전 상태</div>
                        <div
                            class="detail-value"
                            id="chargingStatus"
                        >
                            충전 안 함
                        </div>
                    </div>

                    <div class="detail-box">
                        <div class="detail-label">운행 상태</div>
                        <div
                            class="detail-value"
                            id="drivingStatus"
                        >
                            대기 중
                        </div>
                    </div>
                </div>
            </section>

            <!-- 입출차 버튼 -->
            <section class="card">
                <h2 class="card-title">차량 호출</h2>

                <div class="button-group">
                    <button
                        class="control-button entry-button"
                        id="entryButton"
                        onclick="requestRoute('entry')"
                    >
                        입차
                    </button>

                    <button
                        class="control-button exit-button"
                        id="exitButton"
                        onclick="requestRoute('exit')"
                    >
                        출차
                    </button>
                </div>
            </section>

            <!-- 경로 생성 상태 -->
            <section class="card">
                <h2 class="card-title">자동 경로 생성</h2>

                <div
                    class="route-status"
                    id="routeStatusBox"
                >
                    <div
                        class="route-status-title"
                        id="routeStatusTitle"
                    >
                        명령 대기
                    </div>

                    <div
                        class="route-status-message"
                        id="routeStatusMessage"
                    >
                        입차 또는 출차 버튼을 눌러주세요.
                    </div>
                </div>

                <div class="route-info">
                    <div class="route-info-row">
                        <span class="route-info-label">
                            현재 위치
                        </span>

                        <span
                            class="route-info-value"
                            id="currentLocation"
                        >
                            입구 대기구역
                        </span>
                    </div>

                    <div class="route-info-row">
                        <span class="route-info-label">
                            목적지
                        </span>

                        <span
                            class="route-info-value"
                            id="destination"
                        >
                            -
                        </span>
                    </div>

                    <div class="route-info-row">
                        <span class="route-info-label">
                            경로 상태
                        </span>

                        <span
                            class="route-info-value"
                            id="routeState"
                        >
                            생성 전
                        </span>
                    </div>
                </div>
            </section>
        </aside>
    </main>

    <script>
        let commandRunning = false;

        function cameraError() {
            const systemText =
                document.getElementById("systemStatusText");

            systemText.textContent = "카메라 연결 대기";
        }

        function updateBattery(percent) {
            const batteryValue =
                document.getElementById("batteryValue");

            const batteryFill =
                document.getElementById("batteryFill");

            const safePercent = Math.max(
                0,
                Math.min(100, Number(percent))
            );

            batteryValue.textContent = `${safePercent}%`;
            batteryFill.style.width = `${safePercent}%`;

            if (safePercent <= 20) {
                batteryFill.style.background = "#ef4444";
            } else if (safePercent <= 40) {
                batteryFill.style.background = "#f59e0b";
            } else {
                batteryFill.style.background =
                    "linear-gradient(90deg, #22c55e, #84cc16)";
            }
        }

        function setButtonsDisabled(disabled) {
            document.getElementById("entryButton").disabled =
                disabled;

            document.getElementById("exitButton").disabled =
                disabled;
        }

        function setRouteStatus(type, title, message) {
            const statusBox =
                document.getElementById("routeStatusBox");

            statusBox.className = `route-status ${type}`;

            document.getElementById(
                "routeStatusTitle"
            ).textContent = title;

            document.getElementById(
                "routeStatusMessage"
            ).textContent = message;
        }

        async function requestRoute(command) {
            if (commandRunning) {
                return;
            }

            commandRunning = true;
            setButtonsDisabled(true);

            const isEntry = command === "entry";

            const destination = isEntry
                ? "자동 배정 주차공간"
                : "출차 대기구역";

            document.getElementById(
                "destination"
            ).textContent = destination;

            document.getElementById(
                "routeState"
            ).textContent = "경로 생성 중";

            document.getElementById(
                "drivingStatus"
            ).textContent = "명령 처리 중";

            setRouteStatus(
                "processing",
                isEntry
                    ? "입차 경로 생성 중"
                    : "출차 경로 생성 중",
                "차량의 현재 위치와 목적지를 확인하고 있습니다."
            );

            try {
                /*
                 * 나중에 Flask 또는 ROS2와 연결할 부분이다.
                 *
                 * Flask 주소 예시:
                 * POST /api/route/entry
                 * POST /api/route/exit
                 */

                const response = await fetch(
                    `/api/route/${command}`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body: JSON.stringify({
                            vehicle_id: "PINKY_01",
                            command: command
                        })
                    }
                );

                if (!response.ok) {
                    throw new Error(
                        `서버 응답 오류: ${response.status}`
                    );
                }

                const result = await response.json();

                document.getElementById(
                    "destination"
                ).textContent =
                    result.destination || destination;

                document.getElementById(
                    "routeState"
                ).textContent = "경로 생성 완료";

                document.getElementById(
                    "drivingStatus"
                ).textContent = "주행 준비";

                setRouteStatus(
                    "success",
                    "경로 생성 완료",
                    result.message ||
                        "자동 경로가 생성되었습니다."
                );
            } catch (error) {
                /*
                 * 아직 백엔드 연결 전이므로
                 * 화면 확인용으로 임시 성공 처리한다.
                 */

                console.warn(
                    "백엔드 연결 전 데모 모드:",
                    error
                );

                await new Promise(
                    resolve => setTimeout(resolve, 1200)
                );

                document.getElementById(
                    "routeState"
                ).textContent = "데모 경로 생성 완료";

                document.getElementById(
                    "drivingStatus"
                ).textContent = "주행 준비";

                setRouteStatus(
                    "success",
                    "경로 생성 완료",
                    isEntry
                        ? "빈 주차공간까지 입차 경로가 생성되었습니다."
                        : "출차 대기구역까지 경로가 생성되었습니다."
                );
            } finally {
                commandRunning = false;
                setButtonsDisabled(false);
            }
        }

        /*
         * 현재는 화면 테스트용 배터리 값이다.
         * 나중에 ROS2 /battery/percent 값으로 변경한다.
         */
        updateBattery(78);
    </script>
</body>
</html>
